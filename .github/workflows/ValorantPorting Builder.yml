name: ValorantPorting Builder

on:
  workflow_dispatch:
    inputs:
        appVersion:
          description: 'ValorantPorting Version And Release Tag'
          required: true
          default: '1.0.X.X'

permissions:
  contents: write # create the release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: GIT Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: .NET Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: .NET Restore
        run: dotnet restore ValorantPorting

      - name: CUE4Parse-Natives (animation decompression; built into the app)
        run: |
          cmake -S CUE4Parse/CUE4Parse-Natives -B natives-build -A x64
          cmake --build natives-build --config Release
          New-Item -ItemType Directory -Force ./ValorantPorting/Natives | Out-Null
          # built into the app (it unpacks it next to itself) ...
          Copy-Item natives-build/Release/CUE4Parse-Natives.dll ./ValorantPorting/Natives/
          # ... and still uploaded for the updaters of 1.8 - 1.10.0, which only accept a release that has it
          New-Item -ItemType Directory -Force ./ValorantPorting/bin/Publish | Out-Null
          Copy-Item natives-build/Release/CUE4Parse-Natives.dll ./ValorantPorting/bin/Publish/

      - name: vgmstream (game sounds to .wav; built into the app)
        run: |
          # a fixed release, checked against its known SHA-256 so a changed download can't slip into the app
          Invoke-WebRequest "https://github.com/vgmstream/vgmstream/releases/download/r2117/vgmstream-win64.zip" -OutFile ./ValorantPorting/Natives/vgmstream-win64.zip
          $hash = (Get-FileHash ./ValorantPorting/Natives/vgmstream-win64.zip -Algorithm SHA256).Hash
          if ($hash -ne "6C4A8A3813864FEFED081BBD337DBC0AD93BF88E0B92F5DB98D7AB258B22DC6C") { throw "vgmstream download doesn't match: $hash" }

      - name: .NET Publish
        run: dotnet publish ValorantPorting -c Release --no-self-contained -r win-x64 -f net10.0-windows -o "./ValorantPorting/bin/Publish/" -p:PublishReadyToRun=false -p:PublishSingleFile=true -p:DebugType=None -p:GenerateDocumentationFile=false -p:DebugSymbols=false -p:AssemblyVersion=${{ github.event.inputs.appVersion }} -p:FileVersion=${{ github.event.inputs.appVersion }}

      - name: Blender add-on ZIP
        # the add-on folder itself goes into the zip, which is what Blender's "Install from Disk" expects
        run: |
          Compress-Archive -Path ValorantPortingBlender -DestinationPath ValorantPortingBlender.zip

      - name: Release notes
        # this version's section of CHANGELOG.md ("## <version>"), shown by the app as "What's new"
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.appVersion }}"
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, "## $version")
          if ($start -lt 0) { Write-Warning "CHANGELOG.md has no '## $version' section"; "" | Set-Content release-notes.md; exit 0 }
          $end = $start + 1
          while ($end -lt $lines.Count -and -not $lines[$end].StartsWith('## ')) { $end++ }
          if ($end -gt $start + 1) { $lines[($start + 1)..($end - 1)] | Set-Content release-notes.md } else { "" | Set-Content release-notes.md }

      - name: GIT Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ValorantPorting v${{ github.event.inputs.appVersion }}"
          body_path: release-notes.md
          tag_name: ${{ github.event.inputs.appVersion }}
          target_commitish: ${{ github.sha }}
          files: |
            ./ValorantPorting/bin/Publish/ValorantPorting.exe
            ./ValorantPorting/bin/Publish/CUE4Parse-Natives.dll
            ValorantPortingBlender.zip
            ./ValorantPortingBlender/valorant_psk_psa_b5.py

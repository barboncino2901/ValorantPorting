name: ValorantPorting Builder

on:
  workflow_dispatch:
    inputs:
        appVersion:
          description: 'ValorantPorting Version And Release Tag'
          required: true
          default: '1.0.X.X'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: GIT Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'true'

      - name: Fetch Submodules Recursively
        run: git submodule update --init --recursive

      - name: .NET Setup
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '10.0.x'

      - name: .NET Restore
        run: dotnet restore ValorantPorting

      - name: .NET Publish
        run: dotnet publish ValorantPorting -c Release --no-self-contained -r win-x64 -f net10.0-windows -o "./ValorantPorting/bin/Publish/" -p:PublishReadyToRun=false -p:PublishSingleFile=true -p:DebugType=None -p:GenerateDocumentationFile=false -p:DebugSymbols=false -p:AssemblyVersion=${{ github.event.inputs.appVersion }} -p:FileVersion=${{ github.event.inputs.appVersion }}
   
      - name: CUE4Parse-Natives (animation decompression)
        run: |
          cmake -S CUE4Parse/CUE4Parse-Natives -B natives-build -A x64
          cmake --build natives-build --config Release
          Copy-Item natives-build/Release/CUE4Parse-Natives.dll ./ValorantPorting/bin/Publish/

      - name: Blender ZIP File
        uses: papeloto/action-zip@v1
        with:
          files: ./ValorantPortingBlender/
          dest: ValorantPortingBlender.zip

      - name: Blender Octane ZIP File
        uses: papeloto/action-zip@v1
        with:
          files: ./ValorantPortingBlenderOctane/
          dest: ValorantPortingBlenderOctane.zip

      - name: GIT Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          title: "ValorantPorting v${{ github.event.inputs.appVersion }}"
          automatic_release_tag: ${{ github.event.inputs.appVersion }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          files: |
            ./ValorantPorting/bin/Publish/ValorantPorting.exe
            ./ValorantPorting/bin/Publish/CUE4Parse-Natives.dll
            ValorantPortingBlender.zip
            ValorantPortingBlenderOctane.zip
            ./ValorantPortingBlender/valorant_psk_psa_b5.py
